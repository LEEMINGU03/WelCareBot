intake_task:
  description: >
    사용자 메시지: "{message}"
    대화 이력:
    {history}

    아래 방식으로 대화하세요:

    [처음 대화 시작]
    - 사용자 보다 먼저 "안녕하세요! 저는 찾아드림 이예요. 어떤 복지를 찾아드릴까요?"라는 메세지를 출력해
      그 뒤 사용자가  짧은 메시지를 보냈다면,
      어떤 상황인지 편하게 말할 수 있도록 열린 질문을 하세요.
      예) "어떤 도움이 필요하신가요?", "요즘 어떤 어려움이 있으신가요?"

    [정보 수집]
    - 사용자의 답변을 듣고, 복지 정책 검색에 필요한 정보가 무엇인지 스스로 판단하세요.
    - 정해진 목록 없이, 상황에 맞게 필요한 정보를 1-2개씩 자연스럽게 질문하세요.
    - 일반적으로 나이, 거주 지역, 소득 수준, 가구 상황 등이 필요하지만
      사용자의 상황에 따라 유연하게 판단하세요.

    [검색 준비 완료 판단]
    - 사용자의 상황과 기본 조건(나이, 지역 등)이 파악되면 COMPLETE로 반환하세요.
    - 너무 많은 정보를 요구하지 마세요. 3-4턴 안에 검색을 시작할 수 있어야 합니다.
  expected_output: >
    다음 JSON 형식을 엄격히 준수하세요:
    {{
      "status": "INCOMPLETE" 또는 "COMPLETE",
      "category": "파악된 상황 요약 (자유 형식, 예: '만 28세 미취업 청년', '65세 독거 어르신')",
      "follow_up_question": "추가 질문 (INCOMPLETE일 때만 작성)",
      "conditions": {{
        "summary": "사용자 상황 요약",
        "age": "나이",
        "region": "거주 지역",
        "income": "소득 수준",
        "household": "가구 상황",
        "etc": "기타 파악된 정보"
      }}
    }}

translate_task:
  description: >
    아래는 복지 정책 검색 결과입니다:
    {policy_result}

    다음 두 가지를 한 번에 수행하세요:

    [1] 행정 용어 순화
    - '소득인정액 → 가정의 실제 수입으로 계산한 금액', '부양의무자 → 부모님이나 자녀',
      '차상위계층 → 기초생활수급자 바로 위 소득 계층' 등 어려운 행정 용어를 쉬운 말로 바꾸세요.
    - 문장은 짧고 단순하게 유지하세요.
    - 정책명, 금액, 자격 조건 등 원래 내용은 절대 바꾸지 마세요.

    [2] Markdown 형식으로 깔끔하게 출력
    - 아래 expected_output 구조를 정확히 따르세요.
    - 웹과 터미널 모두에서 바로 사용할 수 있어야 합니다.
  expected_output: >
    아래 Markdown 구조를 정확히 따르세요:

    # 맞춤 복지 정책 안내

    ---

    ## 1. 정책 이름

    **어떤 도움인가요?**
    혜택 내용 (쉬운 말로, 금액은 그대로)

    **누가 받을 수 있나요?**
    자격 내용 (쉬운 말로)

    **어떻게 신청하나요?**
    신청 방법 (쉬운 말로)

    **언제까지 신청하나요?**
    마감일 (상시이면 "언제든지 신청 가능")

    [더 알아보기 →](URL)

    ---

    (이후 정책도 ## 2. ## 3. 순서로 동일한 구조 반복)

policy_search_task:
  description: >
    사용자 조건: {conditions}

    아래 순서로 정책을 검색하세요:

    [1단계] SerperDevTool로 검색
    - "{conditions} 복지 정책 신청" 키워드로 검색하세요.
    - 반드시 검색 결과에 포함된 실제 URL을 그대로 사용하세요.
    - bokjiro.go.kr, 고용노동부, 복지부, 지자체 사이트 결과를 우선합니다.

    [2단계] ScrapeWebsiteTool로 직접 링크 확보
    - 검색 결과로 나온 URL을 ScrapeWebsiteTool로 직접 접근해
      해당 정책의 상세 페이지 URL을 확인하세요.
    - bokjiro.go.kr 정책은
      https://www.bokjiro.go.kr/ssis-tbu/twataa/wlfareInfo/moveTWAT52011M.do
      형태의 상세 URL이 존재합니다. 해당 URL을 크롤링해서 찾으세요.

    [주의]
    - 홈페이지 대표 URL(예: bokjiro.go.kr)은 절대 사용하지 마세요.
    - 검색·크롤링으로 직접 확인한 URL만 사용하세요.
    - URL을 확인할 수 없으면 빈 문자열 대신 가장 가까운 검색 결과 URL을 넣으세요.
  expected_output: >
    다음 JSON 형식을 엄격히 준수하세요:
    {{
      "status": "SUCCESS",
      "policies": [
        {{
          "name": "정책명",
          "benefit": "혜택 내용",
          "eligibility": "수혜 자격",
          "how_to_apply": "신청 방법",
          "deadline": "마감일",
          "url": "크롤링 또는 검색으로 확인한 실제 상세 페이지 URL"
        }}
      ]
    }}
