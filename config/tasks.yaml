intake_task:
  description: >
    사용자 메시지: "{message}"
    대화 이력:
    {history}

    ──────────────────────────────────────────
    [복지 분류 체계]
    아래 분류를 기준으로 사용자의 니즈를 파악하세요.
    번호 입력과 자유 텍스트 입력을 모두 허용합니다.
    텍스트로 입력 시 가장 가까운 분류로 자동 매핑하고,
    분류에 없는 내용은 그대로 사용하세요.

    1. 주거        → 월세 지원 / 전세자금 대출 / 공공임대주택 / 주거환경 개선
    2. 취업·일자리  → 구직활동 지원 / 직업훈련 / 창업 지원 / 실업급여
    3. 의료·건강    → 의료비 지원 / 건강검진 / 정신건강 / 장기요양
    4. 교육        → 장학금 / 학비 지원 / 직업교육 / 평생교육
    5. 생계·소득    → 기초생활보장 / 긴급복지 / 근로장려금 / 사회적 일자리
    6. 육아·가족    → 보육비 지원 / 아동수당 / 한부모 가족 / 다자녀 지원
    7. 노인        → 노인 일자리 / 요양 서비스 / 노인 주거 / 노인 의료
    8. 장애인       → 활동 지원 / 장애인 일자리 / 장애 수당 / 장애인 교육
    9. 청년        → 주거 지원 / 청년 저축 / 취업 지원 / 창업 지원
    ──────────────────────────────────────────

    [단계별 진행 방식]

    STEP 1 — 대분류 선택 (아직 선택 안 된 경우)
    - 처음 대화: "안녕하세요! 저는 찾아드림이에요 😊 어떤 분야의 복지를 찾으시나요?"와 함께
      위 1~9번 목록을 보여주세요.
    - 목록 하단에 "목록에 없는 내용도 자유롭게 입력하실 수 있어요!"를 반드시 추가하세요.
    - 사용자가 번호 또는 텍스트로 답하면 대분류를 확정합니다.

    STEP 2 — 소분류 선택 (대분류가 확정된 경우)
    - 해당 대분류의 소분류 목록을 번호와 함께 제시하세요.
    - 사용자가 선택하거나 직접 말로 설명하면 소분류를 확정합니다.
    - 분류 목록에 없는 내용을 말하면 그대로 welfare_type_minor에 기록하세요.

    STEP 3 — 지역 & 나이 수집 (대분류·소분류 확정 후)
    - "사시는 지역과 나이를 알려주세요!" 한 번에 물어보세요.
    - 둘 다 파악되면 즉시 COMPLETE를 반환하세요.

    [공통 규칙]
    - 각 단계에서 이미 파악된 정보는 다시 묻지 마세요.
    - 단계 이외의 추가 정보는 절대 요구하지 마세요.
  expected_output: >
    다음 JSON 형식을 엄격히 준수하세요:
    {{
      "status": "INCOMPLETE" 또는 "COMPLETE",
      "follow_up_question": "다음 단계 질문 (INCOMPLETE일 때만 작성)",
      "conditions": {{
        "welfare_type_major": "대분류 (예: 주거, 청년, 의료·건강)",
        "welfare_type_minor": "소분류 (예: 월세 지원, 청년 저축)",
        "region": "거주 지역",
        "age": "나이"
      }}
    }}


eligibility_task:
  description: >
    선택된 정책 정보:
    {policy_json}

    대화 이력:
    {history}

    사용자 최근 답변: "{message}"

    위 정책의 자격 조건을 대화 이력을 참고하여 하나씩 확인하세요:
    - 이미 확인된 조건은 절대 다시 묻지 마세요.
    - 아직 확인되지 않은 조건을 쉬운 말로 1개씩만 질문하세요.
    - 모든 조건 충족 확인 시 → ELIGIBLE 반환
    - 조건 미충족 확인 시 → NOT_ELIGIBLE 반환
    - 아직 확인 중 → INCOMPLETE + 다음 질문 반환
  expected_output: >
    다음 JSON 형식을 엄격히 준수하세요:
    {{
      "status": "ELIGIBLE" 또는 "NOT_ELIGIBLE" 또는 "INCOMPLETE",
      "message": "다음 질문 또는 확인 메시지",
      "reason": "판단 이유 (ELIGIBLE/NOT_ELIGIBLE일 때)"
    }}


policy_search_task:
  description: >
    사용자 조건: {conditions}
    검색 지역: {search_region}
    검색 범위: {scope}

    SerperDevTool로만 검색하세요. 크롤링은 하지 않습니다.

    [검색 방법]
    - "{search_region} 복지 정책 신청" 키워드로 검색하세요.
    - 반드시 {scope}에서 시행하는 정책만 선별하세요. 다른 지역 범위의 정책은 제외하세요.
    - bokjiro.go.kr, 고용노동부, 복지부, 지자체 사이트를 우선합니다.
    - 검색 결과 snippet에서 정책명, 혜택, 자격, 신청 방법을 추출하세요.
    - 검색 결과에 포함된 URL을 그대로 사용하세요. 추가 크롤링 없이 snippet 정보만 활용하세요.
    - 정책은 최대 3개까지만 반환하세요.
  expected_output: >
    다음 JSON 형식을 엄격히 준수하세요:
    {{
      "status": "SUCCESS",
      "policies": [
        {{
          "name": "정책명",
          "benefit": "혜택 내용",
          "eligibility": "수혜 자격",
          "how_to_apply": "신청 방법",
          "deadline": "마감일",
          "url": "검색 결과에 포함된 URL (없으면 빈 문자열)"
        }}
      ]
    }}

# 사용 X
translate_task:
  description: >
    아래는 복지 정책 검색 결과입니다:
    {policy_result}

    다음 두 가지를 한 번에 수행하세요:

    [1] 행정 용어 순화
    - '소득인정액 → 가정의 실제 수입으로 계산한 금액', '부양의무자 → 부모님이나 자녀',
      '차상위계층 → 기초생활수급자 바로 위 소득 계층' 등 어려운 행정 용어를 쉬운 말로 바꾸세요.
    - 정책명, 금액, 자격 조건 등 원래 내용은 절대 바꾸지 마세요.

    [2] Markdown 형식으로 깔끔하게 출력
  expected_output: >
    아래 Markdown 구조를 정확히 따르세요:

    # 맞춤 복지 정책 안내

    ---

    ## 1. 정책 이름

    **어떤 도움인가요?**
    혜택 내용

    **누가 받을 수 있나요?**
    자격 내용

    **어떻게 신청하나요?**
    신청 방법

    **언제까지 신청하나요?**
    마감일

    [더 알아보기 →](URL)

    ---

    (이후 정책도 ## 2. ## 3. 순서로 동일한 구조 반복)
